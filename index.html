        body {

        .container {
            background-color: white;

            max-width: 600px;

            position: relative;

        }
        
        .container::before {

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #d35d6e;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: bounce 2s infinite;
        }
        
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .gif-container {
            margin: 30px auto;
            width: 300px;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);

            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #f8c3cd;
        }
        
        .tenor-gif-embed {
            width: 100%;
            height: 100%;
        }
        
        .balloons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        .balloon {
            position: absolute;
            width: 50px;
            height: 60px;
            background-color: #ff9a9e;
            border-radius: 50%;
            opacity: 0.7;
            animation: float 8s infinite ease-in-out;
        }
        
        .balloon::before {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 25px;
            width: 2px;
            height: 30px;
            background-color: #cccccc;
        }
        
        .balloon:nth-child(2) {
            background-color: #fad0c4;
            left: 10%;
            top: 30%;
            animation-delay: 1s;
        }
        
        .balloon:nth-child(3) {
            background-color: #a2d5f2;
            left: 70%;
            top: 20%;
            animation-delay: 2s;
        }
        
        .balloon:nth-child(4) {
            background-color: #ffcce7;
            left: 40%;
            top: 60%;
            animation-delay: 3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }
        
        .heart {
            color: #ff6b81;
            font-size: 1.5rem;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .gif-container {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
